<!DOCTYPE html>
<!-- saved from url=(0014)about:internet -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Image Labo Photoschool Exhibition</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; }
body { color: #222222; font-family: "Segoe UI", "Helvetica Neue", Arial, "Yu Gothic", YuGothic, "Hiragino Sans", Meiryo, sans-serif; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
#page { position: relative; width: 100%; overflow: hidden; }
.abs { position: absolute; }
.ph { position: absolute; display: block; border: 0; }
.light { font-family: "Segoe UI Light", "Helvetica Neue", "Helvetica", Arial, "Yu Gothic", YuGothic, Meiryo, sans-serif; font-weight: 300; }
.label { color: #999999; letter-spacing: 0.18em; text-transform: uppercase; }
.rule { position: absolute; height: 1px; background: #e2e2e2; overflow: hidden; }
.cell { position: absolute; cursor: pointer; }
.cell .cap { position: absolute; left: 0; width: 100%; white-space: nowrap; overflow: hidden; color: #333333; }
.cell .cap span { color: #aaaaaa; margin-right: 0.6em; }
.cell:hover .cap { color: #000000; }
.txt { position: absolute; }
.no { display: block; color: #999999; letter-spacing: 0.2em; }
.nm { display: block; color: #111111; letter-spacing: 0.08em; }
.ro { display: block; color: #888888; letter-spacing: 0.04em; }
.af { display: block; color: #888888; }
.bar { display: block; width: 32px; height: 1px; background: #bbbbbb; overflow: hidden; }
.cm { color: #444444; line-height: 2; letter-spacing: 0.04em; }
.cm p { margin: 0 0 1.1em 0; }
.cm p.last { margin-bottom: 0; }
.msec { position: relative; border-top: 1px solid #e2e2e2; }
.mph { position: relative; }
.pair { border-collapse: collapse; }
.pair td { padding: 0 1.2em 0 0; vertical-align: top; }
.pair td.en { font-family: Consolas, "Courier New", monospace; color: #666666; }
#hdr { position: fixed; left: 0; top: 0; width: 100%; height: 44px; background: #ffffff; border-bottom: 1px solid #ececec; z-index: 10; }
#hdr .l { position: absolute; left: 24px; top: 15px; font-size: 11px; }
#hdr .r { position: absolute; right: 24px; top: 13px; font-size: 13px; white-space: nowrap; }
#hdr .r a { cursor: pointer; color: #555555; margin-left: 22px; }
#hdr .r a:hover { color: #000000; }
#hdr .r .cnt { color: #aaaaaa; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div id="hdr">
  <div class="l label" id="hdrl">Image Labo Photoschool &nbsp;/&nbsp; The 26th Exhibition</div>
  <div class="r"><span class="cnt" id="cnt"></span><a id="toIdx">出品者一覧</a></div>
</div>
<div id="page"></div>
<div id="flow"></div>
<script type="text/javascript" src="data.js" charset="utf-8"></script>
<script type="text/javascript">
(function () {
  var D = window.EXHIBITION, P = D.people, page = document.getElementById('page');
  var tops = [], idxTop = 0, lazy = [], HDR = 44, MOBILE = false, stableH = 0, lastW = 0, lastH = 0;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function px(v) { return Math.round(v) + 'px'; }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function viewport() {
    var de = document.documentElement;
    return { w: de.clientWidth || document.body.clientWidth, h: window.innerHeight || de.clientHeight };
  }
  function scrollY() { return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0; }

  // 写真を枠いっぱいに、切り抜かずに行で並べる
  function layout(imgs, W, H, gap) {
    var n = imgs.length, best = null, mask, i, r, k, maxMask = 1;
    if (!n) { return []; }
    for (i = 1; i < n; i++) { maxMask *= 2; }
    for (mask = 0; mask < maxMask; mask++) {
      var rows = [], cur = [0];
      for (i = 1; i < n; i++) {
        if (Math.floor(mask / Math.pow(2, i - 1)) % 2 === 1) { rows.push(cur); cur = [i]; } else { cur.push(i); }
      }
      rows.push(cur);
      var hs = [], sumH = 0;
      for (r = 0; r < rows.length; r++) {
        var S = 0;
        for (k = 0; k < rows[r].length; k++) { S += imgs[rows[r][k]].w / imgs[rows[r][k]].h; }
        var hh = (W - gap * (rows[r].length - 1)) / S;
        hs.push({ h: hh, S: S }); sumH += hh;
      }
      var avail = H - gap * (rows.length - 1);
      if (avail <= 0) { continue; }
      var sc = sumH > avail ? avail / sumH : 1, area = 0;
      for (r = 0; r < rows.length; r++) { area += hs[r].h * sc * hs[r].h * sc * hs[r].S; }
      if (!best || area > best.area * 1.001) { best = { area: area, rows: rows, hs: hs, sc: sc }; }
    }
    var out = [], tot = gap * (best.rows.length - 1);
    for (r = 0; r < best.rows.length; r++) { tot += best.hs[r].h * best.sc; }
    var y = (H - tot) / 2;
    for (r = 0; r < best.rows.length; r++) {
      var rh = best.hs[r].h * best.sc, rw = rh * best.hs[r].S + gap * (best.rows[r].length - 1), x = (W - rw) / 2;
      for (k = 0; k < best.rows[r].length; k++) {
        var im = imgs[best.rows[r][k]], iw = rh * im.w / im.h;
        out.push({ img: im, x: x, y: y, w: iw, h: rh }); x += iw + gap;
      }
      y += rh + gap;
    }
    return { items: out, w: W, h: tot };
  }

  // まず軽いサムネイルを表示し、近づいたら高画質版に差し替える（空白にならない）
  function imgsHtml(imgs, x0, y0, W, H, gap, thumb, eager) {
    var L = layout(imgs, W, H, gap), s = '', i;
    for (i = 0; i < L.items.length; i++) {
      var it = L.items[i];
      var id = 'im' + lazy.length;
      if (!thumb) { lazy.push({ id: id, src: (MOBILE && it.img.m) ? it.img.m : it.img.f, done: false }); }
      s += '<img class="ph" id="' + id + '" alt="" src="' + esc(it.img.t) + '" ' +
           'style="left:' + px(x0 + it.x) + ';top:' + px(y0 + it.y) + ';width:' + px(it.w) + ';height:' + px(it.h) + '">';
    }
    return s;
  }

  function commentHtml(text) {
    var t = String(text).replace(/\r/g, ''), paras = t.split(/\n\s*\n/), s = '', i, j;
    if (t.indexOf('|') >= 0) {
      s = '<table class="pair">';
      for (i = 0; i < paras.length; i++) {
        var pl = paras[i].split('\n');
        if (i > 0) { s += '<tr><td colspan="2" style="height:1em"></td></tr>'; }
        for (j = 0; j < pl.length; j++) {
          var c = pl[j].indexOf('|');
          s += c < 0 ? '<tr><td colspan="2">' + esc(pl[j]) + '</td></tr>'
                     : '<tr><td>' + esc(pl[j].substring(0, c)) + '</td><td class="en">' + esc(pl[j].substring(c + 1)) + '</td></tr>';
        }
      }
      return s + '</table>';
    }
    for (i = 0; i < paras.length; i++) {
      var ls = paras[i].split('\n'), o = [];
      for (j = 0; j < ls.length; j++) { o.push(esc(ls[j])); }
      s += '<p' + (i === paras.length - 1 ? ' class="last"' : '') + '>' + o.join('<br>') + '</p>';
    }
    return s;
  }

  function nameHtml(p, i, H) {
    return '<span class="no" style="font-size:' + px(H * 0.015 + 4) + '">No. ' + pad2(i + 1) + '</span>' +
      '<span class="nm" style="font-size:' + px(H * 0.032 + 6) + ';margin-top:' + px(H * 0.012) + '">' + esc(p.n) + '</span>' +
      '<span class="ro light" style="font-size:' + px(H * 0.016 + 5) + ';margin-top:' + px(H * 0.004) + '">' + esc(p.r) + '</span>' +
      (p.a ? '<span class="af" style="font-size:' + px(H * 0.011 + 5) + ';margin-top:' + px(H * 0.008) + '">' + esc(p.a) + '</span>' : '');
  }

  function render(keepIndex) {
    var vp = viewport(), W = vp.w, H = Math.max(vp.h - HDR, 520);
    var mobile = W < 760 || W / vp.h < 0.9;
    MOBILE = mobile;
    stableH = Math.max(stableH, vp.h);
    lastW = W; lastH = vp.h;
    if (mobile) { H = 640; }
    var padX = mobile ? 18 : Math.max(24, W * 0.06), inner = W - padX * 2, y = HDR, s = '', i;
    lazy = []; tops = [];
    document.getElementById('hdrl').style.display = W < 560 ? 'none' : 'block';

    // 出品者一覧（最初の画面）
    idxTop = 0;
    var cols = mobile ? (W >= 420 ? 3 : 2) : (W > 1500 ? 8 : (W > 1100 ? 7 : (W > 800 ? 6 : 4)));
    var cw = inner / cols, gapC = Math.max(10, cw * 0.08), thumbH = (cw - gapC) * 0.78, capH = Math.max(34, H * 0.05);
    if (mobile) {
      y += 28;
      s += '<div class="abs label" style="left:' + px(padX) + ';top:' + px(y) + ';font-size:10px">The 26th Exhibition</div>';
      s += '<div class="abs light" style="left:' + px(padX) + ';top:' + px(y + 20) + ';font-size:' + px(Math.min(24, W * 0.052)) + ';color:#111;white-space:nowrap">' + esc(D.titleJa) + '</div>';
      s += '<div class="abs" style="left:' + px(padX) + ';top:' + px(y + 62) + ';font-size:13px;line-height:1.7;color:#888">出品者一覧<br>写真をタップすると作品ページへ移動します</div>';
      y += 130;
    } else {
      y += H * 0.07;
      s += '<div class="abs label" style="left:' + px(padX) + ';top:' + px(y) + ';font-size:' + px(H * 0.012 + 5) + '">Image Labo Photoschool &nbsp;/&nbsp; The 26th Exhibition</div>';
      s += '<div class="abs light" style="left:' + px(padX) + ';top:' + px(y + H * 0.03) + ';font-size:' + px(H * 0.045 + 8) + ';color:#111;white-space:nowrap">' + esc(D.titleJa) + '</div>';
      s += '<div class="abs" style="left:' + px(padX) + ';top:' + px(y + H * 0.105) + ';font-size:' + px(H * 0.012 + 6) + ';color:#888">出品者一覧　—　写真をクリックすると作品ページへ移動します</div>';
      y += H * 0.17;
    }
    for (i = 0; i < P.length; i++) {
      var col = i % cols, row = Math.floor(i / cols);
      var x0 = padX + col * cw, y0 = y + row * (thumbH + capH + gapC * 0.6), bw = cw - gapC;
      s += '<div class="cell" data-i="' + i + '" style="left:' + px(x0) + ';top:' + px(y0) + ';width:' + px(bw) + ';height:' + px(thumbH + capH) + '">';
      s += imgsHtml(P[i].imgs, 0, 0, bw, thumbH, 2, true, false);
      s += '<div class="cap" style="top:' + px(thumbH + capH * 0.18) + ';font-size:' + px(Math.min(15, Math.max(11, cw * 0.075))) + '"><span>' + pad2(i + 1) + '</span>' + esc(P[i].n) + '</div></div>';
    }
    y += Math.ceil(P.length / cols) * (thumbH + capH + gapC * 0.6) + H * 0.08;

    // 作品ページ
    var side = 0, flow = '';
    if (mobile) {
      for (i = 0; i < P.length; i++) {
        var mp = P[i], ML = layout(mp.imgs, inner, stableH * 0.6, 6);
        flow += '<div class="msec" id="sec' + i + '" style="padding:28px ' + px(padX) + ' 40px">' +
          '<div class="mph" style="height:' + px(ML.h) + '">' + imgsHtml(mp.imgs, 0, 0, inner, ML.h, 6, false, false) + '</div>' +
          '<div style="margin-top:22px">' + nameHtml(mp, i, 560) + '<span class="bar" style="margin:16px 0"></span>' +
          '<div class="cm" style="font-size:14px">' + commentHtml(mp.c) + '</div></div></div>';
      }
      flow += '<div class="msec" style="padding:24px ' + px(padX) + ' 40px"><span class="label" style="font-size:11px">Image Labo Photoschool &nbsp;/&nbsp; The 26th Exhibition</span></div>';
      page.style.height = px(y);
      page.innerHTML = s;
      var fl = document.getElementById('flow');
      fl.innerHTML = flow;
      for (i = 0; i < P.length; i++) { tops.push(document.getElementById('sec' + i).offsetTop); }
      bindCells();
      loadVisible();
      return;
    }
    document.getElementById('flow').innerHTML = '';
    for (i = 0; i < P.length; i++) {
      var p = P[i], st = y;
      tops.push(st);
      s += '<div class="rule" style="left:' + px(padX) + ';top:' + px(st) + ';width:' + px(inner) + '"></div>';
      var m = H * 0.08, areaH = H - m * 2, S = 0, k;
      for (k = 0; k < p.imgs.length; k++) { S += p.imgs[k].w / p.imgs[k].h; }
      var wide = p.imgs.length && (inner * 0.62) / S < areaH * 0.55 && S > 2.2 && String(p.c).length <= 120;
      if (wide) {
        // 横長の作品：写真を上に大きく、文章を下に
        var gW = Math.max(6, W * 0.006), phH = layout(p.imgs, inner, areaH * 0.66, gW).h;
        var blockTop = st + m + (areaH - phH - H * 0.05 - H * 0.2) / 2;
        s += imgsHtml(p.imgs, padX, blockTop, inner, phH, gW, false, false);
        var ty = blockTop + phH + H * 0.05;
        s += '<div class="txt" style="left:' + px(padX + inner * 0.04) + ';top:' + px(ty) + ';width:' + px(inner * 0.3) + '">' + nameHtml(p, i, H) + '</div>';
        s += '<div class="txt cm" id="cm' + i + '" data-max="' + Math.round(st + H - m * 0.6 - ty) + '" style="left:' + px(padX + inner * 0.4) + ';top:' + px(ty) + ';width:' + px(inner * 0.52) + '">' + commentHtml(p.c) + '</div>';
      } else {
        var pw = inner * 0.62, tw = inner * 0.29, photoLeft = side % 2 === 0;
        var px0 = photoLeft ? padX : padX + inner - pw;
        var tx0 = photoLeft ? padX + inner - tw : padX;
        s += imgsHtml(p.imgs, px0, st + m, pw, areaH, Math.max(6, W * 0.006), false, false);
        s += '<div class="txt" id="tb' + i + '" data-top="' + Math.round(st + m) + '" data-h="' + Math.round(areaH) + '" style="left:' + px(tx0) + ';top:' + px(st + m) + ';width:' + px(tw) + '">' +
             nameHtml(p, i, H) + '<span class="bar" style="margin:' + px(H * 0.03) + ' 0"></span>' +
             '<div class="cm" id="cm' + i + '">' + commentHtml(p.c) + '</div></div>';
        side++;
      }
      y += H;
    }
    // 最後に教室名
    s += '<div class="rule" style="left:' + px(padX) + ';top:' + px(y) + ';width:' + px(inner) + '"></div>';
    s += '<div class="abs label" style="left:' + px(padX) + ';top:' + px(y + 30) + ';font-size:12px">' + 'Image Labo Photoschool &nbsp;/&nbsp; The 26th Exhibition</div>';
    y += 90;

    page.style.height = px(y);
    page.innerHTML = s;
    fitTexts(H);
    bindCells();
    loadVisible();
  }

  // 文章が枠からはみ出す場合は文字を小さくし、枠の中で上下中央に置く
  function fitTexts(H) {
    var i, base = H * 0.0155 + 5, minF = 10;
    for (i = 0; i < P.length; i++) {
      var cm = document.getElementById('cm' + i), tb = document.getElementById('tb' + i), f = base, g = 0;
      if (!cm) { continue; }
      cm.style.fontSize = px(f);
      if (tb) {
        var maxH = parseInt(tb.getAttribute('data-h'), 10);
        while ((tb.offsetHeight > maxH || cm.scrollWidth > cm.offsetWidth + 1) && f > minF && g < 40) { f *= 0.94; cm.style.fontSize = px(f); g++; }
        tb.style.top = px(parseInt(tb.getAttribute('data-top'), 10) + Math.max(0, (maxH - tb.offsetHeight) / 2));
      } else {
        var mx = parseInt(cm.getAttribute('data-max'), 10);
        while (cm.offsetHeight > mx && f > minF && g < 40) { f *= 0.94; cm.style.fontSize = px(f); g++; }
      }
    }
  }

  function bindCells() {
    var els = page.getElementsByTagName('div'), i;
    for (i = 0; i < els.length; i++) {
      if (els[i].className === 'cell') {
        els[i].onclick = (function (n) { return function () { goTo(tops[n]); }; })(parseInt(els[i].getAttribute('data-i'), 10));
      }
    }
  }

  function upgrade(el, src) {
    var im = new Image();
    im.onload = function () { el.src = src; };
    im.src = src;
  }

  function loadVisible() {
    var vh = viewport().h, top = scrollY() - vh, bot = scrollY() + vh * 3, i;
    for (i = 0; i < lazy.length; i++) {
      var L = lazy[i];
      if (L.done) { continue; }
      var el = document.getElementById(L.id);
      if (!el) { L.done = true; continue; }
      var ey = el.getBoundingClientRect().top + scrollY();
      if (ey > top && ey < bot) { upgrade(el, L.src); L.done = true; }
    }
    var cur = currentIndex(), c = document.getElementById('cnt');
    c.innerHTML = cur >= 0 ? pad2(cur + 1) + ' / ' + pad2(P.length) : '';
  }

  function currentIndex() {
    var y = scrollY() + viewport().h * 0.4, i, cur = -1;
    for (i = 0; i < tops.length; i++) { if (tops[i] - HDR <= y) { cur = i; } }
    return cur;
  }

  var anim = null;
  function stopAnim() { if (anim) { clearInterval(anim); anim = null; } }
  if (document.addEventListener) {
    document.addEventListener('touchstart', stopAnim, false);
    document.addEventListener('wheel', stopAnim, false);
  }
  document.onmousewheel = stopAnim;
  function goTo(target) {
    target = Math.max(0, target - HDR);
    if (anim) { clearInterval(anim); }
    var from = scrollY(), t = 0, steps = 14;
    anim = setInterval(function () {
      t++;
      var e = t / steps; e = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
      window.scrollTo(0, Math.round(from + (target - from) * e));
      if (t >= steps) { clearInterval(anim); anim = null; loadVisible(); }
    }, 16);
  }

  function step(d) {
    var cur = currentIndex(), y = scrollY() + HDR;
    if (d > 0) {
      if (y < idxTop - 5) { goTo(idxTop); return; }
      if (cur < 0) { goTo(tops[0]); return; }
      if (cur < tops.length - 1) { goTo(tops[cur + 1]); }
    } else {
      if (cur > 0) { goTo(tops[cur - 1]); }
      else if (cur === 0) { goTo(idxTop); }
      else { goTo(0); }
    }
  }

  document.getElementById('toIdx').onclick = function () { goTo(idxTop); };
  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.keyCode;
    if (k === 39 || k === 40 || k === 34 || k === 32) { step(1); return false; }
    if (k === 37 || k === 38 || k === 33) { step(-1); return false; }
    if (k === 27) { goTo(idxTop); return false; }
    if (k === 36) { goTo(0); return false; }
  };
  var st = null;
  window.onscroll = function () { if (st) { clearTimeout(st); } st = setTimeout(loadVisible, 60); };
  var rt = null;
  window.onresize = function () {
    if (rt) { clearTimeout(rt); }
    rt = setTimeout(function () {
      var vp = viewport();
      // スマホのアドレスバーの伸び縮み（高さだけの変化）では作り直さない
      if (vp.w === lastW && (MOBILE || Math.abs(vp.h - lastH) < 120)) { return; }
      var cur = currentIndex(); render();
      if (cur >= 0) { window.scrollTo(0, tops[cur] - HDR); loadVisible(); }
    }, 200);
  };
  document.title = D.titleJa;
  render();
})();
</script>
</body>
</html>
